<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>क्विज़ स्टूडियो – किसी भी PDF से क्विज़</title>
<style>
:root{--ink:#14213d;--paper:#f2f5fa;--card:#fff;--line:#d5dbe6;--ok:#1b7f4b;--okbg:#e3f4ea;--bad:#c0392b;--badbg:#fbe9e7;--accent:#2f4b8a;--mute:#5d6a82}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans Devanagari","Mangal","Nirmala UI","Kohinoor Devanagari",system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 14px}
.top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.top select{flex:1;min-width:0;font:inherit;font-size:14px;padding:6px 8px;border-radius:6px;border:0;background:#fff;color:var(--ink)}
.top button{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer;white-space:nowrap}
.stats{display:flex;gap:8px;font-size:14px}
.stats span{flex:1;text-align:center;padding:3px 0;border-radius:6px;background:rgba(255,255,255,.12)}
.stats .r{background:var(--ok)}.stats .w{background:var(--bad)}
main{max-width:640px;margin:0 auto;padding:14px}
.bar{height:5px;background:var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.qno{font-size:13px;color:var(--mute);margin-bottom:4px}
.q{font-size:19px;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:17px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.opt:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt b{min-width:26px;color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.verdict{margin:10px 0 0;font-size:15px;font-weight:600}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.nav{display:flex;gap:8px;margin-top:14px}
button.btn{flex:1;font:inherit;font-size:15px;padding:10px;border-radius:8px;border:1.5px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
button.btn.primary{background:var(--accent);color:#fff}
button.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:12px}
.grid button{font:inherit;font-size:13px;padding:6px 0;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.grid .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.grid .bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.grid .cur{outline:2px solid var(--accent)}
.sum{text-align:center}
.sum .big{font-size:40px;font-weight:700;margin:4px 0}
.row3{display:flex;gap:8px;margin:12px 0}
.row3 div{flex:1;border-radius:8px;padding:8px;font-size:14px}
.row3 b{display:block;font-size:24px}
.wrong-item{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.wrong-item small{color:var(--mute);display:block}
.hide{display:none}
details summary{cursor:pointer;color:var(--accent);font-size:14px;margin-top:12px}
/* upload panel */
.up h2{font-size:18px;margin:0 0 4px}
.up p.sub{margin:0 0 12px;font-size:14px;color:var(--mute)}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.field select,.field input[type=number],.field input[type=text]{width:100%;font:inherit;font-size:15px;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.drop{display:block;border:2px dashed var(--accent);border-radius:10px;padding:18px 10px;text-align:center;cursor:pointer;color:var(--accent);background:#f7f9fd;font-size:15px}
.drop.has{border-style:solid;background:var(--okbg);color:var(--ok)}
.drop input{display:none}
.msg{font-size:14px;margin-top:10px;padding:8px 10px;border-radius:8px;background:#eef2fa}
.msg.err{background:var(--badbg);color:var(--bad)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <select id="setSel" aria-label="क्विज़ चुनें"></select>
    <button id="newBtn">+ नया PDF</button>
  </div>
  <div class="stats"><span class="r">सही: <b id="sr">0</b></span><span class="w">गलत: <b id="sw">0</b></span><span>बाकी: <b id="sl">0</b></span></div>
</header>

<main>
  <!-- PDF upload section -->
  <section id="upPanel" class="card up hide" style="margin-bottom:14px">
    <h2>किसी भी PDF से क्विज़ बनाएँ</h2>
    <p class="sub">PDF चुनिए, बाकी Claude कर देगा। बना हुआ क्विज़ ऊपर वाली लिस्ट में जुड़ जाएगा।</p>

    <label class="drop" id="drop" for="pdfIn"><span id="dropTxt">PDF चुनने के लिए यहाँ दबाएँ (10 MB तक)</span><input type="file" id="pdfIn" accept="application/pdf,.pdf"></label>

    <div class="field" style="margin-top:12px">
      <label for="mode">PDF में क्या है?</label>
      <select id="mode">
        <option value="extract">PDF में पहले से सवाल (MCQ) दिए हैं</option>
        <option value="generate">PDF में पाठ/नोट्स हैं, नए सवाल बनाओ</option>
      </select>
    </div>
    <div class="field" id="cntBox">
      <label for="cnt">कितने सवाल चाहिए?</label>
      <select id="cnt"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
    </div>
    <div class="field" id="diffBox">
      <label for="diff">कठिनाई</label>
      <select id="diff"><option value="easy">आसान</option><option value="medium" selected>मध्यम</option><option value="hard">कठिन</option></select>
    </div>
    <div class="field">
      <label for="qname">क्विज़ का नाम (वैकल्पिक)</label>
      <input type="text" id="qname" placeholder="जैसे: इतिहास अध्याय 3">
    </div>
    <div class="nav" style="margin-top:0">
      <button class="btn primary" id="goBtn" disabled>क्विज़ बनाओ</button>
      <button class="btn" id="stopBtn" disabled>रोकें</button>
    </div>
    <div class="prog hide" id="prog"><i id="progBar"></i></div>
    <div class="msg hide" id="msg"></div>
  </section>

  <div id="quizWrap">
    <div class="bar"><i id="bar"></i></div>
    <div id="quiz" class="card"></div>
    <div class="nav">
      <button class="btn" id="prev">पिछला</button>
      <button class="btn primary" id="next">अगला</button>
    </div>
    <details>
      <summary>सभी प्रश्नों पर जाएँ</summary>
      <div class="grid" id="grid"></div>
    </details>
    <div class="nav"><button class="btn" id="resBtn">रिज़ल्ट देखें</button><button class="btn" id="resetBtn">फिर से शुरू करें</button></div>
    <div id="result" class="card hide" style="margin-top:14px"></div>
    <div class="nav"><button class="btn" id="delBtn" style="border-color:var(--bad);color:var(--bad)">यह क्विज़ हटाएँ</button></div>
  </div>
</main>

const L=["a","b","c","d","e"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

let sets=[{id:"builtin",name:"हिन्दी वर्णमाला (221)",Q:BUILTIN,builtin:true}];
let active="builtin";
const ansBy={}, curBy={};
const S=()=>sets.find(s=>s.id===active);
const ans=()=>ansBy[active]||(ansBy[active]=new Array(S().Q.length).fill(-1));

// ---------- सेव / लोड (सिर्फ़ बनाए हुए क्विज़) ----------
async function saveSets(){
  try{ await window.storage.set("custom-sets",JSON.stringify(sets.filter(s=>!s.builtin).map(({id,name,Q})=>({id,name,Q})))); }
  catch(e){ console.warn("सेव नहीं हो पाया",e); }
}
async function loadSets(){
  try{
    const r=await window.storage.get("custom-sets");
    if(r&&r.value){ JSON.parse(r.value).forEach(s=>sets.push(s)); }
  }catch(e){ /* कोई सेव किया हुआ सेट नहीं */ }
}

// ---------- क्विज़ इंटरफ़ेस ----------
function fillSelect(){
  $("setSel").innerHTML=sets.map(s=>`<option value="${s.id}" ${s.id===active?"selected":""}>${esc(s.name)} (${s.Q.length})</option>`).join("");
  $("delBtn").classList.toggle("hide",!!S().builtin);
}
function stats(){
  const A=ans(),Q=S().Q; let r=0,w=0;
  A.forEach((a,i)=>{ if(a>=0){ a===Q[i][2]?r++:w++; } });
  $("sr").textContent=r;$("sw").textContent=w;$("sl").textContent=Q.length-r-w;
  $("bar").style.width=(Q.length?(r+w)/Q.length*100:0)+"%";
  return [r,w];
}
function render(){
  const Q=S().Q,A=ans(),cur=curBy[active]||0;
  if(!Q.length){ $("quiz").innerHTML="<p>इस क्विज़ में कोई सवाल नहीं है।</p>"; return; }
  const [q,opts,c]=Q[cur],a=A[cur],done=a>=0;
  let h=`<div class="qno">प्रश्न ${cur+1} / ${Q.length}</div><p class="q">${esc(q)}</p>`;
  opts.forEach((o,i)=>{
    let cls=""; if(done){ if(i===c)cls="ok"; else if(i===a)cls="bad"; }
    h+=`<button class="opt ${cls}" data-i="${i}" ${done?"disabled":""}><b>(${L[i]})</b><span>${esc(o)}</span></button>`;
  });
  if(done) h+= a===c?`<p class="verdict ok">✔ सही उत्तर</p>`:`<p class="verdict bad">✘ गलत — सही उत्तर: (${L[c]}) ${esc(opts[c])}</p>`;
  $("quiz").innerHTML=h;
  $("quiz").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A[cur]=+b.dataset.i;render();drawGrid();});
  $("prev").disabled=cur===0;$("next").disabled=cur===Q.length-1;
  stats();
}
function drawGrid(){
  const Q=S().Q,A=ans(),cur=curBy[active]||0;
  $("grid").innerHTML=Q.map((_,i)=>{
    const a=A[i];let c=a<0?"":(a===Q[i][2]?"ok":"bad");if(i===cur)c+=" cur";
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join("");
  $("grid").querySelectorAll("button").forEach(b=>b.onclick=()=>{curBy[active]=+b.dataset.i;render();drawGrid();window.scrollTo(0,0);});
}
function switchSet(id){
  active=id;$("result").classList.add("hide");fillSelect();render();drawGrid();window.scrollTo(0,0);
}
function result(){
  const Q=S().Q,A=ans(),[r,w]=stats(),left=Q.length-r-w,att=r+w,pct=att?Math.round(r/att*100):0;
  let h=`<div class="sum"><div class="big">${r} / ${Q.length}</div><div>सही उत्तर ${att?`(हल किए गए प्रश्नों में ${pct}%)`:""}</div>
  <div class="row3"><div style="background:var(--okbg)"><b>${r}</b>सही</div><div style="background:var(--badbg)"><b>${w}</b>गलत</div><div style="background:#e8ecf3"><b>${left}</b>छोड़े गए</div></div></div>`;
  if(w){
    h+=`<h3 style="margin:8px 0">गलत किए गए प्रश्न</h3>`;
    A.forEach((a,i)=>{ if(a>=0&&a!==Q[i][2]) h+=`<div class="wrong-item">${i+1}. ${esc(Q[i][0])}<small>आपका उत्तर: (${L[a]}) ${esc(Q[i][1][a])}</small><small style="color:var(--ok)">सही उत्तर: (${L[Q[i][2]]}) ${esc(Q[i][1][Q[i][2]])}</small></div>`; });
    h+=`<div class="nav"><button class="btn primary" id="retryBtn">सिर्फ़ गलत सवाल दोबारा करें</button></div>`;
  }
  $("result").innerHTML=h;$("result").classList.remove("hide");
  const rb=$("retryBtn");
  if(rb) rb.onclick=async()=>{
    const wrongQ=Q.filter((_,i)=>A[i]>=0&&A[i]!==Q[i][2]);
    const id="r"+Date.now();
    sets.push({id,name:"गलत सवाल – "+S().name.slice(0,25),Q:wrongQ});
    await saveSets(); switchSet(id);
  };
  $("result").scrollIntoView({behavior:"smooth"});
}
$("setSel").onchange=e=>switchSet(e.target.value);
$("prev").onclick=()=>{ if((curBy[active]||0)>0){curBy[active]--;render();drawGrid();window.scrollTo(0,0);} };
$("next").onclick=()=>{ const c=curBy[active]||0; if(c<S().Q.length-1){curBy[active]=c+1;render();drawGrid();window.scrollTo(0,0);} };
$("resBtn").onclick=result;
$("resetBtn").onclick=()=>{ if(confirm("इस क्विज़ के सारे उत्तर मिट जाएँगे। फिर से शुरू करें?")){ ansBy[active]=null; delete ansBy[active]; curBy[active]=0; $("result").classList.add("hide"); render(); drawGrid(); window.scrollTo(0,0);} };
$("delBtn").onclick=async()=>{
  if(!confirm("यह क्विज़ हमेशा के लिए हट जाएगा। हटाएँ?"))return;
  sets=sets.filter(s=>s.id!==active); await saveSets(); switchSet("builtin");
};

let pdfB64=null,pdfName="",stopFlag=false,busy=false;
function setMsg(t,err){ const m=$("msg"); m.textContent=t; m.className="msg"+(err?" err":""); if(!t)m.classList.add("hide"); }
function syncMode(){ const g=$("mode").value==="generate"; $("cntBox").classList.toggle("hide",!g); $("diffBox").classList.toggle("hide",!g); }

$("pdfIn").onchange=e=>{
  const f=e.target.files[0]; pdfB64=null; $("goBtn").disabled=true;
  if(!f)return;
  if(f.size>10*1024*1024){ setMsg("PDF 10 MB से बड़ी है। छोटी फ़ाइल चुनिए या PDF को हिस्सों में बाँट लीजिए।",true); return; }
  const r=new FileReader();
  r.onload=()=>{ pdfB64=String(r.result).split(",")[1]; pdfName=f.name.replace(/\.pdf$/i,""); $("dropTxt").textContent="✔ "+f.name; $("drop").classList.add("has"); $("goBtn").disabled=false; setMsg(""); };
  r.onerror=()=>setMsg("फ़ाइल पढ़ी नहीं जा सकी। दोबारा कोशिश कीजिए।",true);
  r.readAsDataURL(f);
};

async function callClaude(prompt){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-6",max_tokens:1000,
      system:"You turn PDFs into multiple-choice quizzes. Reply with a JSON array only: no preamble, no markdown fences.",
      messages:[{role:"user",content:[
        {type:"document",source:{type:"base64",media_type:"application/pdf",data:pdfB64}},
        {type:"text",text:prompt}
      ]}]
    })
  });
  if(!res.ok) throw new Error("API "+res.status);
  const data=await res.json();
  return (data.content||[]).map(i=>i.type==="text"?i.text:"").join("");
}
function parseQs(txt){
  let t=txt.replace(/```json|```/g,"").trim();
  const st=t.indexOf("["); if(st<0)return [];
  t=t.slice(st);
  let arr;
  try{ arr=JSON.parse(t); }
  catch(e){ // कटे हुए JSON में से पूरे सवाल बचा लो
    const end=t.lastIndexOf("}"); if(end<0)return [];
    try{ arr=JSON.parse(t.slice(0,end+1)+"]"); }catch(e2){ return []; }
  }
  return arr.filter(x=>x&&typeof x.q==="string"&&Array.isArray(x.o)&&x.o.length>=2&&x.o.length<=5&&Number.isInteger(x.a)&&x.a>=0&&x.a<x.o.length)
            .map(x=>[x.q.trim(),x.o.map(o=>String(o).trim()),x.a]);
}
const SHAPE='Format: [{"q":"question text","o":["option 1","option 2","option 3","option 4"],"a":0}] where "a" is the 0-based index of the correct option.';

async function build(){
  if(busy||!pdfB64)return;
  busy=true;stopFlag=false;
  $("goBtn").disabled=true;$("stopBtn").disabled=false;$("prog").classList.remove("hide");$("progBar").style.width="0";
  const mode=$("mode").value,target=+$("cnt").value,diff=$("diff").value,B=5;
  const got=[],seen=new Set();let asked=0,fails=0,batches=0;
  try{
    while(!stopFlag){
      if(mode==="generate"&&got.length>=target)break;
      if(batches++>=60)break;
      setMsg(mode==="generate"?`सवाल बन रहे हैं… ${got.length} / ${target}`:`PDF से सवाल निकाले जा रहे हैं… ${got.length} मिले`);
      let prompt;
      if(mode==="extract"){
        prompt=`This PDF contains multiple-choice questions. Skip the first ${asked} questions in PDF order and return the next ${B}. Use the answer key in the PDF when it has one; otherwise work out the correct answer yourself. Keep the original language and wording; if the extracted text looks garbled (broken Devanagari, missing letters), repair it from context. Do not include exam names or source tags. If there are no more questions, return []. ${SHAPE}`;
      }else{
        const avoid=got.slice(-40).map(x=>x[0].slice(0,50)).join(" | ");
        prompt=`Write ${Math.min(B,target-got.length)} new multiple-choice questions based on this PDF's content. Difficulty: ${diff}. Exactly 4 options each, exactly one correct, plausible wrong options, correct option position varied. Use the same language as the PDF. Cover different parts of the document. Do not repeat these earlier questions: ${avoid||"(none yet)"}. ${SHAPE}`;
      }
      let qs=[];
      try{ qs=parseQs(await callClaude(prompt)); }catch(e){ if(++fails>=3)throw e; continue; }
      if(!qs.length){ if(mode==="extract")break; if(++fails>=3)break; continue; }
      fails=0; asked+=qs.length;
      for(const x of qs){ const k=x[0].slice(0,80); if(!seen.has(k)){seen.add(k);got.push(x);} }
      $("progBar").style.width=(mode==="generate"?Math.min(100,got.length/target*100):Math.min(95,got.length/2.5))+"%";
    }
  }catch(e){
    console.error(e);
    setMsg("सवाल बनाते समय दिक्कत आई ("+e.message+"). यह सुविधा Claude के अंदर खुली फ़ाइल में ही चलती है। जो सवाल बन चुके हैं, वे नीचे सेव किए गए हैं।",true);
  }
  if(got.length){
    const id="p"+Date.now();
    sets.push({id,name:$("qname").value.trim()||pdfName||"PDF क्विज़",Q:got});
    await saveSets(); switchSet(id);
    $("upPanel").classList.add("hide");
    setMsg("");
  }else if(!$("msg").classList.contains("err")){
    setMsg("PDF से कोई सवाल नहीं बन पाया। अगर PDF स्कैन की हुई फोटो है तो साफ़ फ़ाइल आज़माइए, या दूसरा विकल्प चुनिए।",true);
  }
  busy=false;$("goBtn").disabled=false;$("stopBtn").disabled=true;$("prog").classList.add("hide");
}
$("goBtn").onclick=build;
$("stopBtn").onclick=()=>{stopFlag=true;setMsg("रोका जा रहा है…");};

(async()=>{ await loadSets(); fillSelect(); render(); drawGrid(); })();
</script>
</body>
</html>
